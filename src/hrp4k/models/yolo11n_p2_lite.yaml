# Ultralytics YOLO11n-P2-lite Model Architecture (Paper-Grade AdaPoth-Lite Detector)
# Parameters: ~3.2M parameters, Strides: [4, 8, 16] (P2, P3, P4)
# Special feature: Retains P2 ultra-fine feature map (stride 4) to accurately capture tiny road potholes.

# Parameters
nc: 1 # number of classes (pothole)
scales:
  # [depth, width, max_channels]
  n: [0.50, 0.25, 1024] # YOLO11n-P2 summary: ~3.2M params

# YOLO11n backbone
backbone:
  # [from, repeats, module, args]
  - [-1, 1, Conv, [64, 3, 2]] # 0-P1/2
  - [-1, 1, Conv, [128, 3, 2]] # 1-P2/4
  - [-1, 2, C3k2, [256, False, 0.25]] # 2
  - [-1, 1, Conv, [256, 3, 2]] # 3-P3/8
  - [-1, 2, C3k2, [512, False, 0.25]] # 4
  - [-1, 1, Conv, [512, 3, 2]] # 5-P4/16
  - [-1, 2, C3k2, [512, True]] # 6
  - [-1, 1, SPPF, [512, 5]] # 7-P4/16 SPPF
  - [-1, 2, C2PSA, [512]] # 8

# YOLO11n-P2-lite head (P2, P3, P4 detection layers)
head:
  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 9 (P4 -> P3)
  - [[-1, 4], 1, Concat, [1]] # 10 cat backbone P3
  - [-1, 2, C3k2, [256, False]] # 11 (P3/8)

  - [-1, 1, nn.Upsample, [None, 2, "nearest"]] # 12 (P3 -> P2)
  - [[-1, 2], 1, Concat, [1]] # 13 cat backbone P2
  - [-1, 2, C3k2, [128, False]] # 14 (P2/4)

  - [-1, 1, Conv, [128, 3, 2]] # 15 (P2 -> P3)
  - [[-1, 11], 1, Concat, [1]] # 16 cat head P3
  - [-1, 2, C3k2, [256, False]] # 17 (P3/8)

  - [-1, 1, Conv, [256, 3, 2]] # 18 (P3 -> P4)
  - [[-1, 8], 1, Concat, [1]] # 19 cat head P4
  - [-1, 2, C3k2, [512, True]] # 20 (P4/16)

  - [[14, 17, 20], 1, Detect, [nc]] # 21 Detect(P2, P3, P4)
