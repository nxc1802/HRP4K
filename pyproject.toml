[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hrp4k-benchmark"
version = "0.5.0"
description = "Reproducible HRP4K dataset, detector and resolution-allocation benchmark CLI"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6",
]

[project.optional-dependencies]
evaluation = ["pycocotools>=2.0.7"]
vision = ["opencv-python>=4.8", "matplotlib>=3.7", "ultralytics>=8.3", "pycocotools>=2.0.7", "huggingface_hub"]
sahi = ["sahi==0.12.5", "ultralytics>=8.3", "opencv-python>=4.8"]
dev = ["pytest>=7.4", "pytest-cov>=4.1", "ruff>=0.1.0"]

[project.scripts]
hrp4k = "hrp4k.cli:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]
include = ["hrp4k*", "hrp4k_suite*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
